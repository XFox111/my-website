name: Audit pipeline

on:
    push:
        branches: ["main"]
        paths-ignore:
            - ".devcontainer/**"
            - ".github/**"
            - "!.github/workflows/audit.yml"
            - ".vscode/**"
            - "**.md"
            - ".env*"
            - "LICENSE"
            - "COPYING"
            - ".git*"
    pull_request:
        branches: ["main"]
        paths-ignore:
            - ".devcontainer/**"
            - ".github/**"
            - "!.github/workflows/audit.yml"
            - ".vscode/**"
            - "**.md"
            - ".env*"
            - "LICENSE"
            - "COPYING"
            - ".git*"
    workflow_dispatch:

jobs:
    audit:
        runs-on: ubuntu-latest
        container: node:26

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7
            - run: npm install

            - run: npm run lint
            - run: npm audit

    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  tags: "my-website:ci"
                  build-args: |
                      CF_SITEKEY=3x00000000000000000000FF
